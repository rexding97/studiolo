# Studiolo 示例配置：可直接在「设置 → 数据」中导入
version: "4.0"
profile:
  title: "Studiolo"
  owner: "your-name"
  layoutMode: "bento"
  dockEnabled: true
  wallpaper: "aurora-peaks"
  customWallpaperUrl: ""
  searchEngine: "google"
  themePreset: "vision-glass"
  themeCustomJson: ""
layout:
  - id: "host-mac"
    kind: "widget"
    x: 1
    y: 1
    w: 4
    h: 2
    widgetType: "server-node"
    configJson: "{\"title\": \"Mac · 主入口\", \"badge\": \"公网入口\", \"ip\": \"192.168.1.10\", \"lanIp\": \"192.168.1.10\", \"role\": \"TLS 终结 · 本机服务\", \"pingMs\": 1, \"cpu\": \"--\", \"mem\": \"--\", \"disk\": \"--\", \"uptime\": \"--\", \"sortBy\": \"order\"}"
  - id: "host-office"
    kind: "widget"
    x: 5
    y: 1
    w: 4
    h: 2
    widgetType: "server-node"
    configJson: "{\"title\": \"Home Lab · 应用服务器\", \"badge\": \"自托管应用\", \"ip\": \"192.168.1.20\", \"lanIp\": \"192.168.1.20\", \"role\": \"容器与内部服务\", \"pingMs\": 2, \"cpu\": \"--\", \"mem\": \"--\", \"disk\": \"--\", \"uptime\": \"--\", \"sortBy\": \"order\"}"
  - id: "host-fnas"
    kind: "widget"
    x: 9
    y: 1
    w: 4
    h: 2
    widgetType: "server-node"
    configJson: "{\"title\": \"NAS · 存储节点\", \"badge\": \"文件与备份\", \"ip\": \"192.168.1.30\", \"lanIp\": \"192.168.1.30\", \"role\": \"家庭存储\", \"pingMs\": 3, \"cpu\": \"--\", \"mem\": \"--\", \"disk\": \"--\", \"uptime\": \"--\", \"sortBy\": \"order\"}"
  - id: "folder-favorites"
    kind: "widget"
    x: 1
    y: 3
    w: 3
    h: 2
    widgetType: "app-folder"
    configJson: "{\"title\": \"常用收藏\", \"badge\": \"书签集合\", \"subtitle\": \"把常去的网站拖进来\", \"sortBy\": \"order\"}"
  - id: "widget-weather"
    kind: "widget"
    x: 4
    y: 3
    w: 3
    h: 2
    widgetType: "weather"
    configJson: "{\"title\": \"实时天气\", \"city\": \"上海\", \"temp\": \"--\", \"condition\": \"——\", \"range\": \"-- / --\", \"humidity\": \"--\"}"
  - id: "widget-notes"
    kind: "widget"
    x: 7
    y: 3
    w: 3
    h: 2
    widgetType: "notes"
    configJson: "{\"title\": \"随手便签\", \"badge\": \"自动保存\", \"text\": \"欢迎使用 Studiolo。\\n\\n• 拖动图标可重新排布\\n• 编辑模式下可新增组件\\n• 设置里可切换主题、壁纸与 Dock\"}"
  - id: "widget-clock"
    kind: "widget"
    x: 10
    y: 3
    w: 2
    h: 1
    widgetType: "clock-metric"
    configJson: "{\"title\": \"系统脉冲\", \"badge\": \"本地服务正常\", \"subtitle\": \"状态每 12 秒刷新\"}"
apps:
  - id: "github"
    name: "GitHub"
    desc: "代码托管与协作"
    href: "https://github.com"
    containerId: "host-mac"
    icon: "github"
    logoUrl: ""
    color: "linear-gradient(145deg, #161b22 0%, #30363d 100%)"
    status: "online"
    port: ""
    note: "示例：可替换成你自己的仓库地址"
    useSiteLogo: true
    pinned: true
    clicks: 0
