name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependency
        run: python -m pip install psutil==6.1.0
      - name: Compile Python
        run: python -m compileall -q server
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          git ls-files -z '*.js' | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Check entrypoint syntax
        run: sh -n docker-entrypoint.sh

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build image
        run: docker build -t studiolo:ci .
      - name: Run HTTP smoke test
        run: |
          set -eu
          cleanup() { docker rm -f studiolo-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name studiolo-ci \
            -p 127.0.0.1:13002:3002 \
            -e REXHUB_INIT_PASSWORD=ci-only-password \
            studiolo:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:13002/api/v1/ready; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs studiolo-ci
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:13002/ >/dev/null
          test "$(docker top studiolo-ci -o pid,user,args | awk 'NR > 1 && $3 == "python" && $4 == "/app/server/rexhub.py" {print $2}')" = "10001"
